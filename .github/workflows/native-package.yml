name: Package SafeKid Android and iOS

on:
  push:
    branches: [feat/native-packaging-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify original web source
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install Capacitor for packaging
        run: npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Create Android shell from unchanged web bundle
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: safekid-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original web source
        run: npm run build
      - name: Install Capacitor for packaging
        run: npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
      - name: Generate iOS shell
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: safekid-ios-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
